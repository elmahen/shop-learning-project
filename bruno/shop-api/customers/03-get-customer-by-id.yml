info:
  name: Get Customer by Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/customers/{{customerId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status ist 200 OK", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Liefert den zuvor angelegten Kunden", () => {
          const body = res.getBody();
          expect(body.id).to.equal(bru.getVar("customerId"));
          expect(body.firstName).to.equal("Anna");
          expect(body.lastName).to.equal("Muster");
          expect(body.email).to.equal(bru.getVar("customerEmail"));
        });

docs: |-
  Lädt den Kunden aus "Create Customer" über seine ID (Happy Path).

  Muss nach "Create Customer" laufen (braucht `customerId`).
